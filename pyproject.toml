[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-accelerator"
version = "0.1.0"
description = "Jira-driven, LangGraph-orchestrated vulnerability remediation platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "srivastavapalak96" }
]
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "langgraph>=0.2.0,<1.0.0",
  "langgraph-checkpoint-sqlite>=2.0.11,<3.0.0",
  "langchain-core>=0.3.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
execution-accelerator = "execution_accelerator.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
